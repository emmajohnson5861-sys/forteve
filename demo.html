<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Dynamic SVG Line Bend</title>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* Reset and Center Container */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            /* Dark slate background */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Interaction Zone Area */
        .container {
            width: 100%;
            height: 600px;
            max-width: 400px;
            position: relative;
            cursor: pointer;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* Prevents curve clipping */
        }

        /* SVG Path Styling */
        #string {
            fill: none;
            stroke: #38bdf8;
            /* Cyan neon glow color */
            stroke-width: 4;
            stroke-linecap: round;
        }
    </style>
</head>

<body>

    <!-- Interactive SVG Structure -->
    <div class="container">
        <svg viewBox="0 0 200 400" preserveAspectRatio="none">
            <!-- M = Start point (100,0) | Q = Control Point (100,200) | End Point (100,400) -->
            <path id="string" d="M 100 0 Q 100 200 100 400" />
        </svg>
    </div>

    <script>
        // Target DOM Nodes
        const container = document.querySelector('.container');
        const string = document.getElementById('string');

        // This object tracks the coordinates of the invisible curve handle
        let linePos = { x: 100, y: 200 };

        // Function to rewrite the path data attribute dynamically
        function updatePath() {
            string.setAttribute('d', `M 100 0 Q ${linePos.x} ${linePos.y} 100 400`);
        }

        // 1. Follow the mouse positioning inside the bounding layout box
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();

            // Map screen cursor pixels directly to the local 200x400 SVG grid space
            const mouseX = ((e.clientX - rect.left) / rect.width) * 200;
            const mouseY = ((e.clientY - rect.top) / rect.height) * 400;

            // Smoothly draw the center toward the cursor
            gsap.to(linePos, {
                x: mouseX,
                y: mouseY,
                duration: 0.2,
                ease: "power2.out",
                onUpdate: updatePath
            });
        });

        // 2. Trigger string release animation when mouse leaves the bounding space
        container.addEventListener('mouseleave', () => {
            // Rebound back to origin layout point (100, 200) with a guitar string style wobble
            gsap.to(linePos, {
                x: 100,
                y: 200,
                duration: 1.2,
                ease: "elastic.out(1, 0.3)", // (Amplitude, Frequency) - Increase amplitude for a wider snap
                onUpdate: updatePath
            });
        });
    </script>

</body>

</html>
